name: Extras
version: '${version}'
main: dev.mintychochip.ExtrasPlugin
api-version: '1.21'
folia-supported: true
description: Persistent parties, friendships, titles, custom advancements, player mailboxes, and item trading, chat channels, and cinematic scenes.
author: jlo
website: https://github.com/aincraft-org/modular-extras
commands:
  chat:
    description: Manage chat channels and preferences.
    aliases: [ch, c]
    permission: extras.chat.use
    permission-message: You do not have permission to use chat.
  social:
    description: Open the MapGUI social menu.
    permission: extras.social.use
    permission-message: You do not have permission to use the social menu.
  cinematic:
    description: Create cinematic camera scenes with shaders and props.
    aliases: [cinematics, cine]
    permission: extras.cinematic.use
    permission-message: You do not have permission to use cinematics.
permissions:
  extras.mail.use:
    description: Open mailbox, send, read, delete own mail
    default: true
  extras.chat.use:
    description: Use chat channels and manage chat preferences
    default: true
  extras.chat.channel.global:
    description: Use global chat
    default: true
  extras.chat.channel.local:
    description: Use local chat
    default: true
  extras.chat.channel.party:
    description: Use party chat
    default: true
  extras.chat.channel.market:
    description: Use market chat
    default: true
  extras.chat.channel.lfg:
    description: Use LFG chat
    default: true
  extras.rewards.use:
    description: View and claim daily rewards, streaks, and leaderboards
    default: true
  extras.rewards.admin:
    description: Reroll and administer daily rewards
    default: op
  extras.social.use:
    description: Open the MapGUI social menu
    default: true
  extras.advancements.use:
    description: List own custom advancements
    default: true
  extras.advancements.admin:
    description: Grant custom advancements to players
    default: op
  extras.cinematic.use:
    description: Create, play, and stop cinematic camera scenes with shaders and props
    default: op
dependencies:
  server:
    MapGUI:
      load: BEFORE
      required: true
      join-classpath: true
