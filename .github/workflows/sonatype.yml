name: CI and Maven Central

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and structural publication checks
        run: >-
          ./gradlew clean test build
          generatePomFileForExtrasApiPublication
          generatePomFileForExtrasPaperPublication
          nmcpCheckAllPublicationsFiles
          -PskipSigning

  publish:
    name: Upload to Sonatype Central
    needs: check
    if: >-
      needs.check.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reject workflow reruns
        if: github.run_attempt != 1
        run: |
          echo 'This release run was retried. Start a new main-branch run instead of reusing an immutable version.'
          exit 1

      - name: Calculate UTC release version
        id: version
        shell: bash
        run: echo "version=$(date -u +'%y.%-m.%-d').${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run signed publication gate
        env:
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew clean test build
          generatePomFileForExtrasApiPublication
          generatePomFileForExtrasPaperPublication
          nmcpCheckAllPublicationsFiles
          -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Upload signed publications
        id: publish
        env:
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f deployment.log' EXIT
          set +e
          ./gradlew publishAggregationToCentralPortal \
            -PreleaseVersion=${{ steps.version.outputs.version }} >deployment.log 2>&1
          gradle_status=$?
          set -e
          if [ "$gradle_status" -ne 0 ]; then
            printf 'Central upload command failed with exit code %s; no deployment status was recorded.\n' \
              "$gradle_status"
            exit "$gradle_status"
          fi
          mapfile -t deployment_ids < <(
            grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' deployment.log | sort -u || true
          )
          if [ "${#deployment_ids[@]}" -ne 1 ]; then
            printf 'Central upload completed without exactly one deployment ID; refusing to report success.\n'
            exit 1
          fi
          deployment_id="${deployment_ids[0]}"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          printf 'Central accepted deployment %s for %s; publication is asynchronous.\n' \
            "$deployment_id" "${{ steps.version.outputs.version }}"

      - name: Report Central upload status
        if: steps.publish.outcome == 'success'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 -w0)"
          response="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $auth" \
            "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")"
          status="$(printf '%s' "$response" | jq -r '.deploymentState')"
          test "$status" != "null"
          printf 'Central deployment %s status: %s. This workflow records upload/status only; verify PUBLISHED and public artifacts before claiming a release.\n' \
            "$DEPLOYMENT_ID" "$status"
          case "$status" in
            FAILED)
              exit 1
              ;;
          esac
